<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <title>UPX Arène — Administration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oxanium:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .params { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0 16px; }
    .case { display: flex; align-items: center; gap: 10px; }
    .case label { margin: 0; }
    tr.moi td { background: var(--accent-fond); }
  </style>
</head>
<body>
  <main class="page">
    <h1>Administration</h1>
    <div class="onglets" id="onglets"></div>

    <!-- Comptes -->
    <section id="onglet-comptes" class="cache panneau">
      <div class="ligne espace">
        <h2 style="margin:0">Comptes</h2>
        <input id="recherche" placeholder="Rechercher un pseudo…" style="max-width:260px">
      </div>
      <p class="muet petit" id="aide-comptes"></p>
      <div class="defile-x">
        <table class="tableau">
          <thead><tr><th>Pseudo</th><th>Rang</th><th>Rôle</th><th>Victoires</th><th>Inscrit le</th><th>Statut</th><th></th></tr></thead>
          <tbody id="joueurs"></tbody>
        </table>
      </div>
    </section>

    <!-- Questions -->
    <section id="onglet-questions" class="cache">
      <form class="panneau" id="form-question">
        <h2 id="titre-question">Nouvelle question</h2>
        <div class="params">
          <div class="champ"><label>Catégorie</label>
            <select id="q-categorie"><option>Last War</option><option>Culture générale</option></select></div>
        </div>
        <div class="champ"><label>Question</label><input id="q-question" maxlength="300" required></div>
        <div class="params" id="q-choix"></div>
        <p class="muet petit">Coche la bonne réponse. 2 réponses minimum, 4 maximum.</p>
        <div class="ligne"><button class="btn principal">Enregistrer</button><button type="button" class="btn lien cache" id="q-annuler">Annuler la modification</button></div>
      </form>
      <div class="panneau" style="margin-top:16px">
        <h2>Questions (<span id="nb-questions">0</span>)</h2>
        <div class="defile-x"><table class="tableau"><thead><tr><th>Catégorie</th><th>Question</th><th>Bonne réponse</th><th>Active</th><th></th></tr></thead><tbody id="questions"></tbody></table></div>
      </div>
    </section>

    <!-- Journaux -->
    <section id="onglet-journaux" class="cache panneau">
      <h2>Journal des actions</h2>
      <div class="defile-x"><table class="tableau"><thead><tr><th>Date</th><th>Auteur</th><th>Action</th><th>Détails</th></tr></thead><tbody id="journaux"></tbody></table></div>
    </section>
  </main>

  <script src="/js/commun.js"></script>
  <script>
    (async () => {
      const { $, $$, echapper, api, toast } = LW;
      const moi = await LW.session();
      if (location.hash === '#creer') { location.replace('/jeux'); return; } // ancienne adresse de la création de partie
      if (!LW.peutOrganiser(moi)) { location.href = '/accueil'; return; }
      LW.barre('admin');

      // ------------------------------------------------ onglets selon les droits
      const onglets = [['comptes', LW.estAdmin(moi) ? 'Comptes & rangs' : 'Comptes', true],
        ['questions', 'Questions du quiz', LW.estAdmin(moi)], ['journaux', 'Journaux', LW.aDroitsSuperAdmin(moi)]].filter((o) => o[2]);
      $('#onglets').innerHTML = onglets.map(([id, t]) => `<button data-onglet="${id}">${t}</button>`).join('');
      const charges = {};
      const ouvrir = (id) => {
        if (!onglets.some((o) => o[0] === id)) id = 'comptes';
        $$('#onglets button').forEach((b) => b.classList.toggle('actif', b.dataset.onglet === id));
        onglets.forEach(([o]) => $(`#onglet-${o}`).classList.toggle('cache', o !== id));
        history.replaceState(null, '', `#${id}`);
        if (!charges[id]) { charges[id] = true; ({ comptes: chargerJoueurs, questions: chargerQuestions, journaux: chargerJournaux })[id](); }
      };
      $$('#onglets button').forEach((b) => (b.onclick = () => ouvrir(b.dataset.onglet)));

      // ------------------------------------------------ comptes
      const RANGS = ['R1', 'R2', 'R3', 'R4', 'R5'];
      let recherche = '';
      $('#aide-comptes').textContent = (LW.estAdmin(moi)
        ? 'Les nouveaux comptes sont R1. Le R5 (un seul) a les droits du super admin : donner R5 à quelqu\'un fait redescendre l\'ancien R5 en R4. Les R4 admin peuvent nommer des admins. Un R1 ou un R2 ne peut pas être admin. '
        : '') + '🔑 donne un mot de passe temporaire (le membre devra le changer à sa prochaine connexion ; le mot de passe actuel n\'est jamais visible). Un R4 ne gère ni les R5 ni les admins ; un R5 ne gère pas les admins ; personne ne peut supprimer son propre compte.';

      /** Petite fenêtre (confirmation ou saisie) : résout avec la valeur saisie, true, ou null si annulé. */
      function fenetre({ titre, texte, champ = false, bouton = 'Confirmer', danger = false }) {
        return new Promise((resolve) => {
          const v = LW.h(`<div class="voile"><form class="panneau fenetre">
            <h2>${echapper(titre)}</h2>${texte ? `<p class="muet">${echapper(texte)}</p>` : ''}
            ${champ ? `<div class="champ"><label for="f-mdp">Mot de passe temporaire</label><input type="text" id="f-mdp" minlength="6" maxlength="72" required autocomplete="off" spellcheck="false"><div class="aide">6 caractères minimum. Transmets-le au membre : il devra le changer à sa prochaine connexion.</div></div>` : ''}
            <div class="ligne"><button class="btn ${danger ? 'danger' : 'principal'}">${echapper(bouton)}</button><button type="button" class="btn lien" data-annuler>Annuler</button></div>
          </form></div>`);
          const fermer = (val) => { v.remove(); document.removeEventListener('keydown', echap); resolve(val); };
          const echap = (e) => { if (e.key === 'Escape') fermer(null); };
          document.addEventListener('keydown', echap);
          v.querySelector('[data-annuler]').onclick = () => fermer(null);
          v.onclick = (e) => { if (e.target === v) fermer(null); };
          v.querySelector('form').onsubmit = (e) => { e.preventDefault(); fermer(champ ? v.querySelector('#f-mdp').value : true); };
          document.body.appendChild(v);
          (v.querySelector('#f-mdp') || v.querySelector('button')).focus();
        });
      }

      async function chargerJoueurs() {
        const { joueurs, droits } = await api(`/api/admin/joueurs?q=${encodeURIComponent(recherche)}`);
        const joueursParId = Object.fromEntries(joueurs.map((j) => [j.id, j]));
        $('#joueurs').innerHTML = joueurs.map((j) => {
          const m = j.modifiable;
          const role = j.role === 'SUPER_ADMIN' ? '<span class="badge bleu">Super admin</span>'
            : droits.roles && m && LW.peutEtreAdmin(j.rang) ? `<select data-role="${j.id}" style="width:auto;padding:6px"><option value="JOUEUR" ${j.role === 'JOUEUR' ? 'selected' : ''}>Joueur</option><option value="ADMIN" ${j.role === 'ADMIN' ? 'selected' : ''}>Admin</option></select>`
            : j.role === 'ADMIN' && LW.peutEtreAdmin(j.rang) ? '<span class="badge bleu">Admin</span>'
            : `<span class="muet" ${droits.roles && m ? 'title="Un R1 ou un R2 ne peut pas être admin"' : ''}>Joueur</span>`;
          return `<tr class="${j.id === moi.id ? 'moi' : ''}">
            <td><b>${echapper(j.pseudo)}</b></td>
            <td>${m ? `<select data-rang="${j.id}" data-actuel="${j.rang}" style="width:auto;padding:6px">${RANGS.filter((r) => droits.rangs.includes(r) || r === j.rang).map((r) => `<option ${r === j.rang ? 'selected' : ''}>${r}</option>`).join('')}</select>` : `<span class="badge or">${j.rang}</span>`}</td>
            <td>${role}</td><td>${j.victoires}</td><td class="muet petit">${LW.date(j.dateInscription)}</td>
            <td>${j.actif ? '<span class="badge vert">Actif</span>' : '<span class="badge rouge">Bloqué</span>'}</td>
            <td>${m || j.gerable ? `<div class="ligne" style="gap:4px;flex-wrap:nowrap">
              ${m ? `<button class="btn petit" data-bloquer="${j.id}" data-actif="${j.actif}">${j.actif ? 'Bloquer' : 'Débloquer'}</button>` : ''}
              ${j.gerable ? `<button class="btn petit" data-mdp="${j.id}" data-pseudo="${echapper(j.pseudo)}" title="Modifier le mot de passe (mot de passe temporaire)">🔑</button>
              <button class="btn petit danger" data-supprimer="${j.id}" data-pseudo="${echapper(j.pseudo)}">Supprimer</button>` : ''}</div>` : ''}</td></tr>`;
        }).join('') || '<tr><td colspan="7" class="vide">Aucun joueur.</td></tr>';

        $$('[data-rang]').forEach((s) => (s.onchange = () => {
          // un seul R5 : confirmer la passation (l'ancien R5 redescend R4 ; si c'est moi, je perds les droits du R5)
          if (!LW.peutEtreAdmin(s.value) && joueursParId[s.dataset.rang]?.role === 'ADMIN'
            && !confirm(`Un ${s.value} ne peut pas être admin : il perdra le rôle admin. Continuer ?`)) { s.value = s.dataset.actuel; return; }
          if (s.value === 'R5' && !confirm(`Donner le rang R5 ? Il n'y a qu'un seul R5 : l'actuel R5${moi.rang === 'R5' && moi.role !== 'SUPER_ADMIN' ? ' (toi)' : ''} redescendra R4.`)) { s.value = s.dataset.actuel; return; }
          const jeTransmets = s.value === 'R5' && moi.rang === 'R5' && moi.role !== 'SUPER_ADMIN';
          action(`/api/admin/joueurs/${s.dataset.rang}/rang`, 'PATCH', { rang: s.value }, 'Rang mis à jour.')
            .then((ok) => { if (ok && jeTransmets) setTimeout(() => location.reload(), 800); }); // mes droits ont changé
        }));
        $$('[data-role]').forEach((s) => (s.onchange = () => action(`/api/admin/joueurs/${s.dataset.role}/role`, 'PATCH', { role: s.value }, 'Rôle mis à jour.')));
        $$('[data-bloquer]').forEach((b) => (b.onclick = () => action(`/api/admin/joueurs/${b.dataset.bloquer}/actif`, 'PATCH', { actif: b.dataset.actif !== 'true' }, 'Compte mis à jour.')));
        $$('[data-mdp]').forEach((b) => (b.onclick = async () => {
          const mdp = await fenetre({ titre: `🔑 Mot de passe de ${b.dataset.pseudo}`, texte: 'Saisis un mot de passe temporaire. Le membre sera déconnecté et devra choisir son propre mot de passe à sa prochaine connexion.', champ: true, bouton: 'Enregistrer' });
          if (mdp) action(`/api/admin/joueurs/${b.dataset.mdp}/mot-de-passe`, 'POST', { motDePasse: mdp }, `Mot de passe temporaire enregistré pour ${b.dataset.pseudo}.`);
        }));
        $$('[data-supprimer]').forEach((b) => (b.onclick = async () => {
          const ok = await fenetre({ titre: `Supprimer définitivement le compte de ${b.dataset.pseudo} ?`, texte: 'Ses parties restent dans l\'historique avec la mention « (compte supprimé) ». S\'il est désigné Conducteur ou VIP aujourd\'hui ou plus tard, la désignation passera à « Non désigné ».', bouton: 'Supprimer définitivement', danger: true });
          if (ok) action(`/api/admin/joueurs/${b.dataset.supprimer}`, 'DELETE', null, 'Compte supprimé.');
        }));
      }
      async function action(url, methode, corps, ok) {
        let reussi = false;
        try { await api(url, { methode, corps }); toast(ok, 'ok'); reussi = true; } catch (e) { toast(e.message, 'erreur'); }
        chargerJoueurs();
        return reussi;
      }
      let delai;
      $('#recherche').oninput = (e) => { clearTimeout(delai); delai = setTimeout(() => { recherche = e.target.value; chargerJoueurs(); }, 250); };

      // ------------------------------------------------ questions du quiz
      let enEdition = null;
      const champsChoix = (choix = ['', '', '', ''], bonne = 0) => {
        $('#q-choix').innerHTML = [0, 1, 2, 3].map((i) => `<div class="champ"><label><input type="radio" name="bonne" value="${i}" ${i === bonne ? 'checked' : ''} style="width:auto;margin-right:6px">Réponse ${i + 1}</label>
          <input class="q-rep" maxlength="120" value="${echapper(choix[i] || '')}" ${i < 2 ? 'required' : ''}></div>`).join('');
      };
      champsChoix();
      let questions = [];
      async function chargerQuestions() {
        ({ questions } = await api('/api/admin/questions'));
        $('#nb-questions').textContent = questions.length;
        $('#questions').innerHTML = questions.map((q) => `<tr><td><span class="badge">${echapper(q.categorie)}</span></td><td>${echapper(q.question)}</td>
          <td class="muet">${echapper(q.choix[q.bonneReponse])}</td><td>${q.active ? '✅' : '—'}</td>
          <td class="ligne" style="gap:4px;flex-wrap:nowrap"><button class="btn petit" data-edit="${q.id}">Modifier</button><button class="btn petit" data-bascule="${q.id}">${q.active ? 'Désactiver' : 'Activer'}</button><button class="btn petit danger" data-suppr="${q.id}">✕</button></td></tr>`).join('')
          || '<tr><td colspan="5" class="vide">Aucune question. Ajoute-en pour pouvoir lancer un quiz.</td></tr>';
        $$('[data-edit]').forEach((b) => (b.onclick = () => editer(questions.find((q) => q.id === Number(b.dataset.edit)))));
        $$('[data-bascule]').forEach((b) => (b.onclick = async () => {
          const q = questions.find((x) => x.id === Number(b.dataset.bascule));
          await api(`/api/admin/questions/${q.id}`, { methode: 'PUT', corps: { ...q, active: !q.active } }).catch((e) => toast(e.message, 'erreur'));
          chargerQuestions();
        }));
        $$('[data-suppr]').forEach((b) => (b.onclick = async () => {
          if (!confirm('Supprimer cette question ?')) return;
          await api(`/api/admin/questions/${b.dataset.suppr}`, { methode: 'DELETE' }).catch((e) => toast(e.message, 'erreur'));
          chargerQuestions();
        }));
      }
      function editer(q) {
        enEdition = q;
        $('#titre-question').textContent = q ? 'Modifier la question' : 'Nouvelle question';
        $('#q-annuler').classList.toggle('cache', !q);
        $('#q-categorie').value = q?.categorie || 'Last War';
        $('#q-question').value = q?.question || '';
        champsChoix(q?.choix, q?.bonneReponse ?? 0);
        if (q) $('#form-question').scrollIntoView({ behavior: 'smooth' });
      }
      $('#q-annuler').onclick = () => editer(null);
      $('#form-question').onsubmit = async (e) => {
        e.preventDefault();
        const reps = $$('.q-rep').map((i) => i.value.trim());
        const bonneIndex = Number($('input[name="bonne"]:checked').value);
        if (!reps[bonneIndex]) return toast('La bonne réponse cochée est vide.', 'erreur');
        // on retire les réponses vides en recalculant l'index de la bonne réponse
        const choix = [];
        let bonneReponse = 0;
        reps.forEach((r, i) => { if (r) { if (i === bonneIndex) bonneReponse = choix.length; choix.push(r); } });
        const corps = { categorie: $('#q-categorie').value, question: $('#q-question').value, choix, bonneReponse, active: enEdition ? enEdition.active : true };
        try {
          await api(enEdition ? `/api/admin/questions/${enEdition.id}` : '/api/admin/questions', { methode: enEdition ? 'PUT' : 'POST', corps });
          toast('Question enregistrée.', 'ok');
          editer(null);
          chargerQuestions();
        } catch (err) { toast(err.message, 'erreur'); }
      };

      // ------------------------------------------------ journaux
      async function chargerJournaux() {
        const { journaux } = await api('/api/admin/journaux');
        $('#journaux').innerHTML = journaux.map((j) => `<tr><td class="petit">${LW.date(j.date)}</td><td>${echapper(j.auteur || '–')}</td>
          <td><span class="badge">${echapper(j.action)}</span></td><td class="muet petit">${echapper(j.details ? JSON.stringify(j.details) : '')}</td></tr>`).join('')
          || '<tr><td colspan="4" class="vide">Rien pour le moment.</td></tr>';
      }

      ouvrir(location.hash.slice(1) || 'comptes');
    })();
  </script>
</body>
</html>
