<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Last War Arène — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oxanium:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="ecran-connexion">
    <div class="carte-connexion">
      <div class="entete">
        <div class="ecusson">⚔</div>
        <h1>Last War Arène</h1>
        <p class="muet">Mini-jeux d'élimination de l'alliance.<br>Un seul survivant à la fin.</p>
      </div>
      <div class="panneau">
        <div class="onglets">
          <button data-onglet="connexion" class="actif">Connexion</button>
          <button data-onglet="inscription">Inscription</button>
        </div>
        <form id="formulaire" autocomplete="on">
          <div class="champ">
            <label for="pseudo">Pseudo Last War</label>
            <input id="pseudo" name="username" autocomplete="username" required maxlength="24" placeholder="Ton pseudo exact dans le jeu">
            <div class="aide cache" id="aide-pseudo">Saisis exactement ton pseudo Last War : il sera affiché à toute l'alliance.</div>
          </div>
          <div class="champ">
            <label for="mdp">Mot de passe</label>
            <input id="mdp" name="password" type="password" autocomplete="current-password" required minlength="6" maxlength="72">
          </div>
          <div class="champ cache" id="champ-confirmation">
            <label for="mdp2">Confirme le mot de passe</label>
            <input id="mdp2" type="password" autocomplete="new-password" minlength="6" maxlength="72">
          </div>
          <button class="btn principal" style="width:100%" id="btn-valider">Se connecter</button>
          <p class="muet petit" id="message" style="text-align:center;margin:12px 0 0"></p>
        </form>
      </div>
    </div>
  </main>
  <script src="/js/commun.js"></script>
  <script>
    LW.piedDePage();
    (async () => {
      const { $, $$ } = LW;
      if (await LW.session({ obligatoire: false })) return (location.href = '/accueil');
      let mode = 'connexion';
      const changer = (m) => {
        mode = m;
        $$('.onglets button').forEach((b) => b.classList.toggle('actif', b.dataset.onglet === m));
        $('#champ-confirmation').classList.toggle('cache', m !== 'inscription');
        $('#aide-pseudo').classList.toggle('cache', m !== 'inscription');
        $('#mdp').autocomplete = m === 'inscription' ? 'new-password' : 'current-password';
        $('#btn-valider').textContent = m === 'inscription' ? 'Créer mon compte' : 'Se connecter';
        $('#message').textContent = '';
      };
      $$('.onglets button').forEach((b) => (b.onclick = () => changer(b.dataset.onglet)));
      $('#formulaire').onsubmit = async (e) => {
        e.preventDefault();
        const pseudo = $('#pseudo').value.trim();
        const motDePasse = $('#mdp').value;
        if (mode === 'inscription' && motDePasse !== $('#mdp2').value) return ($('#message').textContent = 'Les deux mots de passe ne correspondent pas.');
        $('#btn-valider').disabled = true;
        try {
          await LW.api(`/api/auth/${mode}`, { methode: 'POST', corps: { pseudo, motDePasse } });
          const retour = new URLSearchParams(location.search).get('retour');
          location.href = retour && retour.startsWith('/') && !retour.startsWith('//') ? retour : '/accueil';
        } catch (err) {
          $('#message').textContent = err.message;
          $('#btn-valider').disabled = false;
        }
      };
    })();
  </script>
</body>
</html>
