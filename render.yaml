# Déploiement sur Render : Dashboard > New + > Blueprint > choisis ce dépôt GitHub.
# Un serveur Node classique, à Francfort (proche de la France) : idéal pour les WebSockets.
#
# IMPORTANT (CI/CD) : Render suit la branche « production », jamais « main ».
# Seule la pipeline GitHub Actions (.github/workflows/livraison.yml) met à jour « production »,
# une fois les tests passés. Voir docs/CICD.md.
services:
  - type: web
    name: UPX-arene          # adresse : https://upx-arene.onrender.com (toujours en minuscules)
    runtime: node
    branch: production       # mise à jour uniquement par la pipeline de livraison
    region: frankfurt
    plan: free               # gratuit : s'endort après 15 min sans visite (réveil ~1 min). « starter » (7 $/mois) = toujours allumé
    buildCommand: npm ci && npx prisma migrate deploy && node prisma/seed.js
    startCommand: npm start
    healthCheckPath: /api/sante
    autoDeploy: true         # chaque mise à jour de la branche « production » par la pipeline redéploie
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL     # Neon : URL « pooled » (avec -pooler)
        sync: false
      - key: DIRECT_URL       # Neon : URL directe (sans -pooler)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_PSEUDO
        sync: false
      - key: SUPER_ADMIN_MOT_DE_PASSE
        sync: false
