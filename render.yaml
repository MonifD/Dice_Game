# Déploiement sur Render : Dashboard > New + > Blueprint > choisis ce dépôt GitHub.
# Un serveur Node classique toujours allumé, à Francfort (proche de la France) : idéal pour les WebSockets.
services:
  - type: web
    name: last-war-arene
    runtime: node
    region: frankfurt
    plan: starter            # 7 $/mois, toujours allumé (le plan gratuit s'endort après 15 min)
    buildCommand: npm ci && npx prisma migrate deploy && node prisma/seed.js
    startCommand: npm start
    healthCheckPath: /api/sante
    autoDeploy: true         # chaque push sur GitHub redéploie (évite de pousser pendant une partie !)
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL     # Neon : URL « pooled » (avec -pooler)
        sync: false
      - key: DIRECT_URL       # Neon : URL directe (sans -pooler)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SUPER_ADMIN_PSEUDO
        sync: false
      - key: SUPER_ADMIN_MOT_DE_PASSE
        sync: false
