# Base PostgreSQL + Redis pour développer en local :  docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lastwar
      POSTGRES_PASSWORD: lastwar
      POSTGRES_DB: lastwar
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
